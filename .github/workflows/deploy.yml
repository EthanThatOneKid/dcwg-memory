name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # An ingest run commits and pushes with the repository's GITHUB_TOKEN, and
  # GitHub starts no new workflow run for an event that token produced, so
  # `push` alone never fires here and the published site stays one ingest
  # behind. Trigger on the ingest run finishing instead.
  workflow_run:
    workflows: ["Discord ingest"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # An ingest that failed pushes nothing, so skip the redeploy rather than
    # republish identical content.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      # Enables Pages for the repository if it is not already enabled, and
      # exposes the site's base URL to later steps.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Build site
        # The wikipedia theme ported onto the engine's published
        # @wazoo/wiki/theme entrypoint: no Python, no pip install.
        run: deno run -A build.ts
      - uses: actions/upload-pages-artifact@v3
        with:
          # Published at /dcwg-memory/; build.ts nests its output under
          # _site/<base_url>/, so upload the repo-prefixed directory.
          path: _site/dcwg-memory

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
