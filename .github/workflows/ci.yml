name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  wiki:
    name: Wiki gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # fmt (which writes), check --strict, lint --strict, render --check, and
      # the orphan check. The engine is embedded, so this job needs no Python and
      # no `pip install`; it exits non-zero on any failure.
      - name: Run the five gates
        run: deno task --config tools/discord/deno.json gates

  connector:
    name: Discord connector check + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type check
        working-directory: tools/discord
        run: deno check ingest.ts
      - name: Test
        working-directory: tools/discord
        run: deno test -A
      - name: Capture index matches the tree
        run: deno run -A tools/discord/index_page.ts --check
