name: Discord ingest

# One run = pull new channel activity over the Discord REST API, write it as an
# append-only capture, let the model fold it into the wiki pages, then validate
# and push. The connector refuses to write anything the repo's own gates reject:
# if `fmt`, `check --strict`, `lint --strict`, `render --check`, the orphan
# check, or the forum thread check fails, the page edits are reverted and the run
# reports NEEDS_ATTENTION
# instead of committing prose that does not pass. The capture is committed either
# way: it is the record, and a capture the model could not fold in stays queued for
# a later run rather than being dropped with the page edits. The gates are the
# embedded Deno engine (`deno task gates`), so this job installs no Python.
#
# Why this pushes straight to main instead of opening a pull request: the cursor
# in raw/discord/.cursor has to advance for the next run to know where to resume.
# A cursor parked in an unmerged PR would make every daily run re-fetch the same
# range and add another capture for it. The gates are the review step here.
#
# Each venue commits and pushes its own work as soon as its own fold finishes. The
# runner is ephemeral, so one venue's failure must not be able to discard another
# venue's capture; the job still fails at the end when any venue reported
# NEEDS_ATTENTION, after the venues that succeeded have pushed. Because a failed
# run can now commit, the Pages deploy no longer waits for the ingest workflow to
# report success.
#
# The page pass runs `fx`, the Vercel Labs coding agent, against the Vercel AI
# Gateway, which edits the wiki files itself instead of returning one JSON list
# of rewrites. It is installed below as a pinned binary: the version decides the
# agent loop, the tool set, and the JSON envelope the connector parses, so an
# unpinned install would let the automation change underneath a run. `--editor
# api` selects the older one-shot path, which needs no CLI.
#
# The Gateway is the only inference provider: one key, one catalogue, and one
# budget probe. Required repository secrets:
#   DISCORD_BOT_TOKEN       the capture bot's token (its own application)
#   AI_GATEWAY_API_KEY      inference for the wiki pass, both editors
# A pass costs money rather than requests here, and the free models cost
# nothing: the connector asks the Gateway for the team's credit balance and for
# the catalogue price of the model this run was pointed at, and refuses to start
# a pass the balance cannot pay for. Each venue runs with --budget-share <i>/<n>,
# so the balance is divided between the venues that share it rather than spent by
# whichever runs first. See "The budget" in AGENTS.md for the arithmetic.
# The bot token is never echoed: the connector reads it from the environment and
# never accepts a token as a command-line argument.
#
# The pass's permission rules are written below rather than committed, because fx
# keeps them in `~/.fx/settings.json`, which is per-machine and not per-repo. They
# are a second control, not the boundary: the connector compares the tree either
# side of a pass and reverts anything outside `wiki/`.

on:
  schedule:
    # 13:17 UTC = 06:17 America/Los_Angeles during PDT, 05:17 during PST.
    - cron: "17 13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch and print, change nothing"
        type: boolean
        default: false
      skip_wiki:
        description: "Capture only; do not touch the wiki pages"
        type: boolean
        default: false
      model:
        description: "Model for the wiki pass. Blank = the default. A Gateway id, vendor/model, e.g. nvidia/nemotron-3.5-lightning-free"
        type: string
        default: ""
      editor:
        description: "fx or api (blank = the connector's default)"
        type: string
        default: ""

concurrency:
  group: discord-ingest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      # venue=channel-id, one per line. Add a line to capture another channel.
      # A venue is the channel plus every thread under it, so a forum works here
      # too: its posts are threads, and each one is captured under its own heading.
      VENUES: |
        dcwg-brainstorm=1558965777850302546
        dcwg-propose=1559218298128695386
      # github.event.inputs is a string map that is empty on a scheduled run, so
      # every one of these falls back in the shell rather than in an expression.
      # MODEL falls back in the expression on purpose: a scheduled run cannot
      # take an input, so the repository variable DCWG_MODEL is how the schedule
      # is repointed at another model (e.g. alibaba/qwen3.7-flash) without editing
      # this file. Unset, the connector uses the default wiki.ts names.
      MODEL: ${{ github.event.inputs.model || vars.DCWG_MODEL }}
      EDITOR: ${{ github.event.inputs.editor }}
      DRY_RUN: ${{ github.event.inputs.dry_run }}
      SKIP_WIKI: ${{ github.event.inputs.skip_wiki }}
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.x"

      # Pinned, because the connector parses this binary's JSON envelope and drives
      # its agent loop: a silent upgrade would change both. The version is asserted
      # so the pin cannot drift into a lie.
      - name: Install the page-pass CLI
        run: |
          curl -fsSL https://fx.sh/setup.sh | bash -s -- v0.0.14
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          test "$("$HOME/.local/bin/fx" --version)" = "0.0.14"

      # fx reads its permission rules from a per-machine file that cannot be
      # committed, so the workflow writes them. `edit` is the permission name for
      # both `write_file` and `edit_file`, and the allow pattern has to be the tree
      # form `wiki/**`: a bare `wiki/*` matches an edit to an existing page but
      # denies creating a new one, because a create is matched against its parent.
      - name: Write the pass's permission rules
        run: |
          mkdir -p "$HOME/.fx"
          cat > "$HOME/.fx/settings.json" <<'JSON'
          {
            "provider": "gateway",
            "permission_mode": "auto",
            "permission": {
              "*": "deny",
              "read": "allow",
              "glob": "allow",
              "grep": "allow",
              "list": "allow",
              "bash": "deny",
              "edit": { "*": "deny", "wiki/**": "allow" }
            }
          }
          JSON

      - name: Unit-test the connector before trusting it
        run: deno test -A
        working-directory: tools/discord

      - name: Ingest
        env:
          # Repository secrets are scoped to this repo, so the bare names are
          # unambiguous here. The process env var stays prefixed because Zo
          # secrets are account-wide and a bare DISCORD_BOT_TOKEN on this host
          # is another project's bot.
          DCWG_DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: |
          # Per-venue commits, inside the loop. The runner is ephemeral and one venue must
          # not be able to discard another venue's work: each venue commits and pushes its
          # own capture, cursor, and (when its fold passed) pages before the next starts.
          # The job still fails at the end if any venue reported NEEDS_ATTENTION.
          git config user.name "dcwg-ingest"
          git config user.email "dcwg-ingest@users.noreply.github.com"
          status=0
          # How many venues share today's free-model budget. The connector divides what
          # the provider reports left by the runs still to come, so a venue with a
          # backlog cannot spend a later venue's allowance. It is counted from the same
          # VENUES block the loop reads, so a line added there is counted too.
          venue_total=$(grep -c . <<< "$VENUES")
          venue_index=0
          # Push a venue's commit, rebasing if `main` moved while the model was running.
          # The runner is ephemeral, so a rejected push would drop the venue's commit;
          # rebasing keeps it. A rebase that conflicts aborts and fails the job loudly,
          # and because the discarded commit held the capture, the cursor, and the pages
          # together, the next run re-fetches that range rather than skipping it.
          push_main() {
            if git push; then return 0; fi
            echo "push rejected; rebasing onto origin/main and retrying"
            if git pull --rebase --no-edit origin main && git push; then return 0; fi
            git rebase --abort 2>/dev/null || true
            echo "push failed: rebasing onto origin/main did not succeed"
            return 1
          }
          while IFS='=' read -r venue channel; do
            [ -z "$venue" ] && continue
            venue_index=$((venue_index + 1))
            echo "::group::$venue ($channel) [$venue_index/$venue_total]"
            # Start this venue from a clean tree. A venue that died mid-pass can leave
            # edited or brand-new files behind, and `git add -A wiki` would then carry
            # them into the next venue's commit. `.dcwg` goes too, so the marker that
            # authorises staging `wiki/` cannot survive from an earlier run.
            git checkout -- wiki/
            git clean -qfd wiki/
            rm -rf .dcwg
            # --limit 0 drains the backlog, so a daily run cannot leave a gap
            # behind a message cap.
            args=(--channel "$channel" --venue "$venue" --root . --limit 0 \
              --budget-share "$venue_index/$venue_total")
            # Only pin a model when one was asked for: passing the connector's
            # default id would send a model nobody chose to the Gateway.
            if [ -n "${MODEL:-}" ]; then args+=(--model "$MODEL"); fi
            if [ -n "${EDITOR:-}" ]; then args+=(--editor "$EDITOR"); fi
            [ "${DRY_RUN:-false}" = "true" ] && args+=(--dry-run)
            [ "${SKIP_WIKI:-false}" = "true" ] && args+=(--skip-wiki)
            if ! deno run -A tools/discord/ingest.ts "${args[@]}"; then
              status=1
            fi
            # Commit this venue's work before the next one runs. `raw/discord` is staged
            # whatever happened: the capture is the record, and the cursor advances with
            # it. `wiki/` is staged only when the connector left the `pages-ok` marker,
            # which it writes once the gates pass and removes when they do not. The marker
            # is what separates a tree holding gate-passed pages from one a killed pass
            # left behind, because both look like a dirty `wiki/` and a non-zero exit.
            # It was deleted above, so a run that dies before writing it stages no pages.
            if [ "${DRY_RUN:-false}" != "true" ]; then
              git add -A raw/discord
              # The captures and the index that indexes them are one unit: the index is
              # generated from the tree, so it is staged whenever a capture is. On
              # 2026-10-18 a run committed two captures and no pages, which left main
              # holding an index that contradicted its own captures and failed
              # `index_page.ts --check` on every run afterwards.
              git add -A -- wiki/Captures.md
              if [ -f .dcwg/pages-ok ]; then
                git add -A wiki
              else
                echo "no pages-ok marker for $venue: committing the capture and its index only"
              fi
              if git diff --cached --quiet; then
                echo "nothing to commit for $venue"
              else
                git commit -q -m "ingest: $venue Discord activity for $(date -u +%Y-%m-%d)"
                push_main || status=1
              fi
            fi
            echo "::endgroup::"
          done <<< "$VENUES"
          exit "$status"

      - name: Report what changed
        if: always()
        run: |
          git status --short
          git --no-pager diff --stat

