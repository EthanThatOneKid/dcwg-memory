# Wiki paths, assets, and filename policy (wiki check / wiki lint).
wiki:
  # Markdown and data directories to index (relative to this file).
  input:
    - wiki
  # Static files for custom CSS, logos, favicons (copied on wiki build).
  # `raw` is copied verbatim so the captured evidence is downloadable from the
  # published site at /dcwg-memory/raw/...; it is never parsed as wiki input,
  # which keeps `wiki fmt` from rewriting an append-only capture.
  assets:
    - assets
    - raw
  # Full-filename regex for markdown files (lint.filename_pattern severity).
  filename_pattern: "[A-Za-z0-9_()-]+\\.md"

# RDF document URIs, prefixes, and graph build settings.
graph:
  context:
    "@vocab": https://schema.org/
    schema: https://schema.org/
    wiki: https://EthanThatOneKid.github.io/dcwg-memory/
    wazoo: https://schema.wazoo.dev/
    foaf: http://xmlns.com/foaf/0.1/
    dc: http://purl.org/dc/elements/1.1/
    dcterms: http://purl.org/dc/terms/
    sh: http://www.w3.org/ns/shacl#
    xsd: http://www.w3.org/2001/XMLSchema#

# Page layout and URL routing.
site:
  # Repo-local Wikipedia-style layout (from wazootech/wiki-templates).
  layout: layouts/wikipedia.html
  # GitHub Pages mounts the uploaded artifact at /dcwg-memory/.
  base_url: /dcwg-memory
  url_style: dir

# wiki link command output format and rename repair map.
link:
  style: standard

# Integrity severities (wiki check): SHACL, JSON Schema, routes, layout files.
check:
  missing_layout_file: error
  frontmatter_schema: error
  missing_schema_ref: error

# Convention severities (wiki lint): links, filenames, headings.
lint:
  broken_links: error
  filename_pattern: error
  link_style: error

# Markdown formatting options (wiki fmt) are deliberately not set here.
#
# The two engines spell them differently and each rejects the other's keys, so a
# shared config is only possible by leaving them at the defaults. The Deno
# engine (`@wazoo/wiki`, 0.2.0+) defaults to `textWrap: "never"` and
# `newLineKind: "lf"`, which is what this repo used to ask for; the retired
# Python engine (`wazootech-wiki==0.1.23`) also accepts the config without them.
# Do not reintroduce a `fmt:` block while `build.py` still loads this file
# through the Python engine: it fails with `Invalid key 'textWrap'`, and that
# would take the Pages deploy down with it.
